<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Formulario Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <span class="bg-indigo-950 text-indigo-400 border border-indigo-800/50 text-xs font-semibold px-3 py-1 rounded-full">
                ✉️ Estación de Contacto
            </span>
            <h1 class="text-2xl font-bold tracking-tight">Escríbenos un mensaje</h1>
            <p class="text-slate-400 text-sm">Completa el formulario y nos pondremos en contacto contigo lo antes posible.</p>
        </div>

        <form action="#" method="POST" class="space-y-4">
            <div class="space-y-1">
                <label for="name" class="text-xs font-medium text-slate-300">Nombre completo</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="space-y-1">
                <label for="email" class="text-xs font-medium text-slate-300">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="space-y-1">
                <label for="subject" class="text-xs font-medium text-slate-300">Asunto</label>
                <input type="text" id="subject" name="subject" placeholder="Motivo del mensaje" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="space-y-1">
                <label for="message" class="text-xs font-medium text-slate-300">Mensaje</label>
                <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí..." required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm">
                Enviar Mensaje
            </button>
        </form>
    </div>

</body>
</html>
